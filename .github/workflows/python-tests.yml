name: Python Registry comparator tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Check synthetic sample comparison
        run: python scripts/compare_registry_exports.py examples/registry-before-synthetic.csv examples/registry-after-synthetic.csv
